services:
  postgres:
    image: postgres:16-alpine
    container_name: dhaka-tesla-pool-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dhaka_tesla_pool

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dhaka_tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: dhaka-tesla-pool-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dhaka_tesla_pool
      JWT_SECRET: your-super-secret-key
      PORT: 5000

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: dhaka-tesla-pool-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data: