services:
  postgres:
    image: postgres:16-alpine
    container_name: dhaka-tesla-pool-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dhaka_tesla_pool

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dhaka_tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
